<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name=" viewport " content="width=device-width, initial-scale=1.0">
    <title>表格的增删改查</title>
    <style>
        table {
            width: 100%;
        }
        
        th,
        td {
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <h1 style="text-align:center">表格的增删改查</h1>
    <button>新增数据</button>
    <table>
        <tr>
            <th>姓名</th>
            <th>联系方式</th>
            <th>操作</th>
        </tr>
        <tr>
            <td>罗大富</td>
            <td>12345678910</td>
            <td>
                <button>编辑</button>
                <button>删除</button>
            </td>
        </tr>
    </table>
</body>

</html>
